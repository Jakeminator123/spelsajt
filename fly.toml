app = "spelsajt-game-server"
primary_region = "arn"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "apps/game-server/Dockerfile"

[env]
  GAME_SERVER_HOST = "0.0.0.0"
  GAME_SERVER_PORT = "4000"
  WEB_ORIGIN = "https://spelsajt.vercel.app"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
