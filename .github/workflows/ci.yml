name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build game-server image
        run: docker build --file apps/game-server/Dockerfile --tag spelsajt-game-server:ci .

      - name: Reject ephemeral production configuration
        run: |
          if docker run --rm spelsajt-game-server:ci; then
            echo "Production server started without durable Supabase configuration."
            exit 1
          fi

      - name: Start smoke-test Postgres
        run: |
          docker network create spelsajt-game-server-smoke
          docker run --detach \
            --name spelsajt-postgres-smoke \
            --network spelsajt-game-server-smoke \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17.10-bookworm
          for attempt in {1..30}; do
            if docker exec spelsajt-postgres-smoke pg_isready --username postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs spelsajt-postgres-smoke
          exit 1

      - name: Start configured game-server image
        run: |
          docker run --detach \
            --name spelsajt-game-server-smoke \
            --network spelsajt-game-server-smoke \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_PUBLISHABLE_KEY=container-smoke-key \
            --env SUPABASE_DATABASE_URL=postgresql://postgres@spelsajt-postgres-smoke:5432/postgres \
            spelsajt-game-server:ci

      - name: Verify game-server health
        run: |
          for attempt in {1..30}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' spelsajt-game-server-smoke)"
            state="$(docker inspect --format='{{.State.Status}}' spelsajt-game-server-smoke)"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$state" = "exited" ]; then
              docker logs spelsajt-game-server-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs spelsajt-game-server-smoke
          exit 1

      - name: Verify game-server readiness
        run: |
          docker exec spelsajt-game-server-smoke node -e \
            "fetch('http://127.0.0.1:4000/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"

      - name: Clean up game-server container
        if: always()
        run: |
          docker rm --force spelsajt-game-server-smoke spelsajt-postgres-smoke || true
          docker network rm spelsajt-game-server-smoke || true

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Postgres
        run: pnpm supabase db start

      - name: Apply migrations and seed
        run: pnpm supabase db reset --local

      - name: Test database contracts
        run: pnpm supabase test db --local

      - name: Lint database
        run: pnpm supabase db lint --local --level error --fail-on error

      - name: Test durable game repository
        env:
          SUPABASE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @spelsajt/game-server test -- postgres-repository.integration.test.ts postgres-realtime.integration.test.ts
